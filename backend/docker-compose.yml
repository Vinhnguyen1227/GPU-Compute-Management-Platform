version: '3.8'

services:
  # --- Infrastructure ---
  postgres:
    image: postgres:16-alpine
    container_name: backend-postgres-1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: backend-redis-1
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: backend-zookeeper-1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: backend-kafka-1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.7.0
    container_name: backend-kafka-init-1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes:
      - ./infra/kafka:/scripts

  # --- Microservices ---
  gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    container_name: backend-gateway-1
    ports:
      - "5000:8080"
    depends_on:
      - redis
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - REDIS_CONNECTION=redis:6379
      - JWT__SecretKey=${JWT_SECRET_KEY:-your-256-bit-secret-key-for-dev-environment-only-32bytes}
      - JWT__Issuer=${JWT_ISSUER:-ai-cloud-platform}
      - JWT__Audience=${JWT_AUDIENCE:-ai-cloud-clients}

  auth-service:
    build:
      context: .
      dockerfile: src/AuthService/Dockerfile
    container_name: backend-auth-service-1
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=auth_db;Username=postgres;Password=${POSTGRES_PASSWORD:-devpassword}
      - REDIS_CONNECTION=redis:6379
      - JWT__SecretKey=${JWT_SECRET_KEY:-your-256-bit-secret-key-for-dev-environment-only-32bytes}
      - JWT__Issuer=${JWT_ISSUER:-ai-cloud-platform}
      - JWT__Audience=${JWT_AUDIENCE:-ai-cloud-clients}
      - JWT__AccessTokenExpiryMinutes=${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:-15}
      - JWT__RefreshTokenExpiryDays=${JWT_REFRESH_TOKEN_EXPIRY_DAYS:-30}

  user-service:
    build:
      context: .
      dockerfile: src/UserService/Dockerfile
    container_name: backend-user-service-1
    ports:
      - "5002:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=user_db;Username=postgres;Password=${POSTGRES_PASSWORD:-devpassword}
      - JWT__SecretKey=${JWT_SECRET_KEY:-your-256-bit-secret-key-for-dev-environment-only-32bytes}
      - JWT__Issuer=${JWT_ISSUER:-ai-cloud-platform}
      - JWT__Audience=${JWT_AUDIENCE:-ai-cloud-clients}

  project-service:
    build:
      context: .
      dockerfile: src/ProjectService/Dockerfile
    container_name: backend-project-service-1
    ports:
      - "5003:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=project_db;Username=postgres;Password=${POSTGRES_PASSWORD:-devpassword}
      - JWT__SecretKey=${JWT_SECRET_KEY:-your-256-bit-secret-key-for-dev-environment-only-32bytes}
      - JWT__Issuer=${JWT_ISSUER:-ai-cloud-platform}
      - JWT__Audience=${JWT_AUDIENCE:-ai-cloud-clients}

  job-service:
    build:
      context: .
      dockerfile: src/JobService/Dockerfile
    container_name: backend-job-service-1
    ports:
      - "5004:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=job_db;Username=postgres;Password=${POSTGRES_PASSWORD:-devpassword}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - JWT__SecretKey=${JWT_SECRET_KEY:-your-256-bit-secret-key-for-dev-environment-only-32bytes}
      - JWT__Issuer=${JWT_ISSUER:-ai-cloud-platform}
      - JWT__Audience=${JWT_AUDIENCE:-ai-cloud-clients}

  resource-service:
    build:
      context: .
      dockerfile: src/ResourceService/Dockerfile
    container_name: backend-resource-service-1
    ports:
      - "5005:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=resource_db;Username=postgres;Password=${POSTGRES_PASSWORD:-devpassword}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - REDIS_CONNECTION=redis:6379
      - JWT__SecretKey=${JWT_SECRET_KEY:-your-256-bit-secret-key-for-dev-environment-only-32bytes}
      - JWT__Issuer=${JWT_ISSUER:-ai-cloud-platform}
      - JWT__Audience=${JWT_AUDIENCE:-ai-cloud-clients}

  payment-service:
    build:
      context: .
      dockerfile: src/PaymentService/Dockerfile
    container_name: backend-payment-service-1
    ports:
      - "5006:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=payment_db;Username=postgres;Password=${POSTGRES_PASSWORD:-devpassword}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - JWT__SecretKey=${JWT_SECRET_KEY:-your-256-bit-secret-key-for-dev-environment-only-32bytes}
      - JWT__Issuer=${JWT_ISSUER:-ai-cloud-platform}
      - JWT__Audience=${JWT_AUDIENCE:-ai-cloud-clients}

  worker-service:
    build:
      context: .
      dockerfile: src/WorkerService/Dockerfile
    container_name: backend-worker-service-1
    ports:
      - "5007:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092

volumes:
  postgres-data:
  redis-data:
